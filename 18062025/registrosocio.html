<!doctype html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  </head>
  <body>

    <div class="container-fluid">
        <!-- cabecera -->
        <div class="row">
            <div class="col-md-12">
                <h1>SISTEMA COBRO AGUA KANAUT</h1>
            </div>

        </div>
        <!-- cuerpo -->
         <div class="row">
            <div class="col-md-3">
                <div class="row">
                    <div class="col-md-12">
                        <button type="button" class="btn btn-primary">Insertar Socio</button>
                    </div>
                    
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <button type="button" class="btn btn-primary">Lista Socios</button>
                    </div>
                    
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <button type="button" class="btn btn-primary">Reportes</button>
                    </div>
                    
                </div>
            </div>
            <div class="col-md-9">
                <div class="row">
                    <div class="col-md-2">
                        
                    </div>
                    <div class="col-md-8">
                        <form action="" method="post">
                            <div class="form-group">
                              <label for="">Nombre:</label>
                              <input type="text"
                                class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                              
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="">Apellido Paterno:</label>
                                        <input type="text"
                                            class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                                        
                                    </div>
                                </div>
                                <div class="col-md-6">
                                        <div class="form-group">
                                        <label for="">Apellido Materno  :</label>
                                        <input type="text"
                                            class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                                        
                                        </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                        <div class="form-group">
                                        <label for="">Carnet:</label>
                                        <input type="number"
                                            class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                                        
                                        </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                    <label for="">Celular:</label>
                                    <input type="number"
                                        class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                                    
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check form-check-inline">
                                        <label for="">Sexo:</label>
                                        <label class="form-check-label">
                                            <input class="form-check-input" type="radio" name="sexo" id="hombre" value="checkedValue"> Hombre
                                            <input class="form-check-input" type="radio" name="sexo" id="mujer" value="checkedValue"> Mujer
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                      <label for="">Tipo Socio</label>
                                      <select class="form-control" name="" id="">
                                        <option>Socio 1</option>
                                        <option>Socio 2</option>
                                        <option>Socio 3</option>
                                      </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                      <label for="">Codigo Socio</label>
                                      <input type="text"
                                        class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                                      
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                              <label for="">Direccion</label>
                              <textarea class="form-control" name="" id="" rows="3"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <button type="submit" class="btn btn-primary">Registrar</button>
                                </div>
                                <div class="col-md-6">
                                    <button type="reset" class="btn btn-primary">Limpiar</button>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="col-md-2">
                        
                    </div>
                </div>
            </div>
         </div>
        <!-- Pie de pagina -->
        <div class="row">
            <div class="col-md-12">
                <p>Derechos Reservados -2025</p>
            </div>
        </div>
    </div>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
