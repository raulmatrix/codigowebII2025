<!doctype html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  </head>
  <body>
      
    <div class="container-fluid">
        <h2 class="text-center">Registro Estudiantes</h2>
       <div class="row">
        
        <!-- Menu -->
            <div class="col-md-3">
                Menu
            </div>
            <!-- Cuerpo -->
            <div class="col-md-9">
                <div class="row">
                    <div class="col-md-1">
                        
                    </div>
                    <div class="col-md-10">
                        <div class="form-group">
                          <label for="">Nombres</label>
                          <input type="text"
                            class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                          
                        </div>

                        <!-- Apellidos -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                  <label for="">Apellido Paterno</label>
                                  <input type="text"
                                    class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                                  </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                  <label for="">Apellido Materno</label>
                                  <input type="text"
                                    class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                                  </div>
                            </div>
                        </div>

                        <!-- carnet y celular -->

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                  <label for="">Carnet</label>
                                  <input type="text"
                                    class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                                  </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                  <label for="">Telefono Celular</label>
                                  <input type="text"
                                    class="form-control" name="" id="" aria-describedby="helpId" placeholder="">
                                  </div>
                            </div>
                        </div>

                        <!-- Dpto procedencia -->
                         <div class="form-group">
                           <label for="">Departamento Origen</label>
                           <select class="form-control" name="dpto" id="dpto">
                             <option>Cochabamba</option>
                             <option>La Paz</option>
                             <option>Santa Cruz</option>
                           </select>
                         </div>

                         <div class="row">
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-primary col-md-12">Registrar</button>
                            </div>
                            <div class="col-md-6">
                                <button type="reset" class="btn btn-warning col-md-12">Limpiar</button>
                            </div>
                         </div>


                    </div>
                    <div class="col-md-1">
                        
                    </div>
                </div>
            </div>
       </div> 
    </div>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
